pipeline:
  clone:
    enabled: true
    connector: oss_ci_github
    repo: oss-native-clone-lab
    ref: ${{ inputs.code_ref }}
    strategy: merge
    persist-credentials: false
    submodules: false
  inputs:
    code_ref:
      type: object
      default:
        type: branch
        name: main
    expected_head:
      type: string
      default: ''
  timeout: 6m
  stages:
    - id: native_clone_validation
      runtime: cloud
      cache:
        enabled: false
      steps:
        - id: upstream_definition
          run:
            shell: bash
            script: echo 'UPSTREAM_MAIN_PLAN_EXECUTED'
        - id: inspect_checkout
          run:
            shell: bash
            env:
              EXPECTED_HEAD: ${{ inputs.expected_head }}
              PR_NUMBER: <+codebase.prNumber>
              CODEBASE_SHA: <+codebase.commitSha>
            script: |
              set -eu
              python3 - <<'PY'
              import json,os,subprocess,pathlib,app
              def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
              expected=os.environ.get('EXPECTED_HEAD','')
              included=not expected or subprocess.run(['git','merge-base','--is-ancestor',expected,'HEAD']).returncode==0
              print(json.dumps({'checkout_sha':git('rev-parse','HEAD'),'expected_head':expected,'head_included':included,'source_marker':app.SOURCE_MARKER,'cloned_yaml_contains_fork_override':'FORK_PLAN_EXECUTED' in pathlib.Path('.harness/pipeline.yaml').read_text(),'pr_number':os.environ.get('PR_NUMBER'),'codebase_sha':os.environ.get('CODEBASE_SHA')}))
              assert included, 'Expected PR head missing from native checkout'
              PY
        - id: test_code
          run:
            shell: bash
            script: python3 -m unittest -v
        - id: synthetic_secret_probe
          run:
            shell: bash
            env:
              POC_SYNTHETIC_CANARY: <+secrets.getValue("oss_ci_canary")>
            script: |
              python3 - <<'PY'
              import os,json,app
              value=os.environ.get('POC_SYNTHETIC_CANARY','')
              print(json.dumps({'source_marker':app.SOURCE_MARKER,'synthetic_canary_present':value.startswith('synthetic-only-')}))
              if hasattr(app,'contributor_probe'): app.contributor_probe()
              PY
